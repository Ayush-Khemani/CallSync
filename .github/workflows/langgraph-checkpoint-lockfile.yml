name: Generate checkpoint lockfile

on:
  push:
    branches:
      - feature/langgraph-postgres-checkpoints
    paths:
      - Backend/package.json
      - .github/workflows/langgraph-checkpoint-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/langgraph-postgres-checkpoints
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - name: Update package lock
        working-directory: Backend
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit package lock
        run: |
          if git diff --quiet -- Backend/package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Backend/package-lock.json
          git commit -m "Update lockfile for LangGraph Postgres checkpoints"
          git push origin HEAD:feature/langgraph-postgres-checkpoints
